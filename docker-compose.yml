services:
  music-reference-lab:
    build: .
    container_name: music-reference-lab
    init: true
    ports:
      - "8080:8080"
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./uploads:/app/uploads
      - ./exports:/app/exports
    restart: unless-stopped
    stop_grace_period: 35s
